<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEYOND FRAME? — Graduation Experience</title><style>html,body{margin:0;min-height:100%;background:#c9d3e6;color:#30384b;font-family:Arial,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;letter-spacing:.13em;padding:20px}</style></head><body><div id="boot">LOADING YOUR EXPERIENCE...</div><script>
(async()=>{
 try {
 const response=await fetch('./original.html',{cache:'no-store'});
 if(!response.ok)throw new Error('Model source unavailable ('+response.status+')');
 let html=await response.text();
 const dataMatch=html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
 if(!dataMatch)throw new Error('Embedded 3D model not found');
 const model=JSON.parse(dataMatch[1]);
 model.params={"preset":"chrome","dispersion":0,"anisotropy":0,"specularIntensity":1,"attenuation":null,"roughness":0.05,"metalness":1,"clearcoat":0.6,"clearcoatRoughness":0.05,"transmission":0,"thickness":1.19,"ior":1.5,"iridescence":0,"envMapIntensity":1.6,"sheen":0,"keep":1,"depth":0,"rim":0.15,"logo":0.6};
 html=html.replace(dataMatch[0],'<script id="data" type="application/json">'+JSON.stringify(model)+'<\/script>');
 html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>BEYOND FRAME? — Graduation Experience</title>');
 html=html.replace('</style>',"\n#persistent-title{position:absolute;top:clamp(76px,11vh,140px);left:20px;right:20px;text-align:center;pointer-events:none;opacity:0;transform:translateY(-16px);transition:opacity .75s ease,transform .75s ease;user-select:none}\n#persistent-title.shown{opacity:1;transform:translateY(0)}\n#persistent-title .headline{display:block;font-family:Arial,Helvetica,sans-serif;font-size:clamp(28px,5.5vw,78px);font-weight:900;line-height:.98;letter-spacing:-.065em;background:linear-gradient(165deg,#ffffff 4%,#a8b0bb 31%,#f5f8ff 47%,#737e90 68%,#fafcff 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(1px 2px 0 #768394) drop-shadow(0 8px 14px rgba(42,57,79,.2))}\n#persistent-title .subline{display:block;margin-top:12px;font-size:clamp(13px,1.6vw,21px);font-weight:500;letter-spacing:-.045em;color:#3e4659}\n@media(max-width:600px){#persistent-title{top:14vh;left:14px;right:14px}#persistent-title .headline{font-size:clamp(30px,9.7vw,54px)}#persistent-title .subline{font-size:14px;letter-spacing:-.025em}#brand{top:20px;font-size:9px}}\n\n@media(max-width:600px){#persistent-title{top:12vh}#hint{font-size:9px;letter-spacing:.06em}#controls{bottom:max(24px,env(safe-area-inset-bottom))}}\n"+'</style>');
 html=html.replace('<div id="ui">','<div id="ui"><div id="persistent-title" aria-label="BEYOND FRAME? I just needed to graduate"><span class="headline">BEYOND FRAME?</span><span class="subline">I just needed to graduate</span></div>');
 const errorHandler=`<script>window.addEventListener('error',function(e){const el=document.getElementById('loading');if(el){el.textContent='3D COULD NOT LOAD · PLEASE REFRESH';el.classList.remove('hide')}});window.addEventListener('unhandledrejection',function(e){const el=document.getElementById('loading');if(el){el.textContent='3D COULD NOT LOAD · PLEASE REFRESH';el.classList.remove('hide')}});<\/script>`;
 html=html.replace('</head>',errorHandler+'</head>');
 if(!/<script type="module">[\s\S]*?<\/script>/.test(html))throw new Error('3D viewer script missing');
 html=html.replace(/<script type="module">[\s\S]*?<\/script>/,'<script type="module" src="./experience.js"><\/script>');
 document.open();document.write(html);document.close();
 } catch(err){console.error(err);document.getElementById('boot').textContent='COULD NOT LOAD 3D MODEL · PLEASE REFRESH';}
})();
</script></body></html>
